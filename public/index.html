<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f4ef">
    <meta name="description" content="Send yourself an idea without opening your email.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
    <title>hey me.</title>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <header>
          <h1 id="page-title">hey me.</h1>
        </header>
        <form>
          <label class="sr-only" for="idea">Your idea</label>
          <textarea id="idea" name="idea" placeholder="write something..." rows="8" maxlength="10000"></textarea>
          <div class="form-footer">
            <button type="submit" disabled>send to hey →</button>
          </div>
        </form>
        <div class="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
